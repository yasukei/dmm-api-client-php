name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    name: "Test (PHP ${{ matrix.php-version }}, ${{ matrix.dependency-version }})"
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        php-version: ['8.3', '8.4', '8.5']
        dependency-version: [prefer-lowest, prefer-stable]

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup PHP
        uses: shivammathur/setup-php@eb7c497e18156a6bbabfef1d3a82760b9eda3962 # 2.40.0
        with:
          php-version: ${{ matrix.php-version }}
          coverage: none

      # composer.lock は下限の PHP 8.3 で解決してあり、その指定は
      # config.platform.php として composer.json に入っている。これは
      # composer update にも効くので、外さないと 8.4 / 8.5 のジョブまで
      # 8.3 とみなして解決してしまい、それらの利用者が実際に入れる
      # 組み合わせを一度も試さないことになる。
      # lint ジョブは lock どおりに入れたいので、そちらでは外さない。
      - name: Resolve against the runner's PHP, not the locked floor
        run: composer config --unset platform.php

      - name: Install dependencies
        run: composer update --${{ matrix.dependency-version }} --no-interaction --no-progress

      - name: Run tests
        run: composer test

  lint:
    name: Lint
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup PHP
        uses: shivammathur/setup-php@eb7c497e18156a6bbabfef1d3a82760b9eda3962 # 2.40.0
        with:
          php-version: '8.3'
          coverage: none

      # Packagist への公開を見据えて、composer.json の不備（警告を含む）と
      # composer.lock の追従漏れをここで落とす。
      - name: Validate composer.json and composer.lock
        run: composer validate --strict

      # Packagist の dist は GitHub が git archive で作り、Satis などは Composer の archive で作る。
      # .gitattributes での戻し忘れや紛れ込みに気づけるよう、両方のファイル一覧を、
      # 含めるべきエントリの追跡ファイルと比べる。エントリは .gitattributes で戻したものと揃える。
      # Composer の archive は追跡していないファイルも拾うので、依存を入れる前に実行する。
      - name: Check dist contents
        shell: bash
        run: |
          dir="$RUNNER_TEMP/dist"
          mkdir -p "$dir"
          git ls-files -z -- bin src CHANGELOG.md composer.json LICENSE README.md | tr '\0' '\n' | LC_ALL=C sort > "$dir/expected"
          if [[ ! -s "$dir/expected" ]]; then
            echo "::error::dist に含めるファイルの一覧が空です"
            exit 1
          fi
          git archive -o "$dir/git.tar" HEAD
          composer archive --format=tar --dir="$dir" --file=composer --no-interaction
          status=0
          for archive in git composer; do
            tar -tf "$dir/$archive.tar" --quoting-style=literal | grep -v '/$' | LC_ALL=C sort > "$dir/$archive"
            diff -u --label expected --label "$archive archive" "$dir/expected" "$dir/$archive" || status=1
          done
          exit "$status"

      - name: Install dependencies
        run: composer install --no-interaction --no-progress

      - name: PHPStan
        run: composer stan

      - name: PHP-CS-Fixer
        run: composer cs-check

      - name: Rector
        run: composer rector-dry

      - name: Composer dependency analyser
        run: composer deps

  coverage:
    name: Coverage
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup PHP
        uses: shivammathur/setup-php@eb7c497e18156a6bbabfef1d3a82760b9eda3962 # 2.40.0
        with:
          php-version: '8.3'
          coverage: pcov

      - name: Install dependencies
        run: composer install --no-interaction --no-progress

      # カバレッジの下限は手元の composer coverage には持たせず、ここで --min として渡す。
      # ジョブサマリには合計だけを表で出すので、Clover 形式でも書き出しておく。
      - name: Run tests with coverage
        id: coverage
        run: composer coverage -- --min=95 --colors=never --coverage-clover="$RUNNER_TEMP/clover.xml"

      # タイムアウトやキャンセルで止まったときも書き込むよう always() にし、
      # テストのステップがスキップされたときだけ、このステップもスキップにする。
      # 失敗の原因はテストのステップに出るので、ここは Clover の出力がなくても落とさない。
      # 途中までしか書き出されていないなど、読み込めないか合計が取れないときも、出力がないものとして扱う。
      - name: Write coverage to job summary
        if: ${{ always() && steps.coverage.outcome != 'skipped' }}
        run: |
          php -- "$RUNNER_TEMP/clover.xml" <<'PHP' >> "$GITHUB_STEP_SUMMARY"
          <?php
          libxml_use_internal_errors(true);
          $xml = is_file($argv[1]) ? simplexml_load_file($argv[1]) : false;
          if ($xml === false || !isset($xml->project->metrics['statements'], $xml->project->metrics['methods'])) {
              echo "カバレッジが出力されませんでした\n";
              exit;
          }
          $metrics = $xml->project->metrics;
          echo "| 対象 | カバー済み | 全体 | カバー率 |\n";
          echo "| --- | ---: | ---: | ---: |\n";
          foreach (['行' => 'statements', 'メソッド' => 'methods'] as $label => $name) {
              $covered = (int) $metrics["covered{$name}"];
              $total = (int) $metrics[$name];
              $rate = $total > 0 ? sprintf('%.2f%%', 100 * $covered / $total) : '-';
              echo "| {$label} | {$covered} | {$total} | {$rate} |\n";
          }
          PHP

  mutation:
    name: Mutation
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup PHP
        uses: shivammathur/setup-php@eb7c497e18156a6bbabfef1d3a82760b9eda3962 # 2.40.0
        with:
          php-version: '8.3'
          coverage: pcov

      - name: Install dependencies
        run: composer install --no-interaction --no-progress

      # テストが変異を検出できるかを見る。--everything で covers() を書かずに全クラスを対象にし、
      # 出力の文言が大半を占める CLI（src/Console）は除く。
      # スコアの下限は設けず、テストが落ちたときだけ失敗にする。結果はジョブサマリで見る。
      # shell を指定しない run は pipefail なしの bash -e で動き、パイプの終了コードが
      # tee のものになるので、shell: bash を明示して pipefail を付ける。
      - name: Run mutation testing
        id: mutation
        shell: bash
        run: composer mutate -- --colors=never | tee mutation.txt

      # タイムアウトやキャンセルで止まったときも途中までの出力を残すよう always() にし、
      # ミューテーションのステップがスキップされたときだけ、このステップもスキップにする。
      # 失敗の原因はミューテーションのステップに出るので、ここはスコアがなくても落とさない。
      - name: Write mutation score to job summary
        if: ${{ always() && steps.mutation.outcome != 'skipped' }}
        run: |
          {
            echo '```text'
            grep -E '^ +(Mutations|Score):' mutation.txt || echo 'スコアが出力されませんでした'
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

  zizmor:
    name: zizmor
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Run zizmor
        uses: zizmorcore/zizmor-action@53290badfa369cb0bf7ad16342cb62c2fa47ac7b # v0.8.0
        with:
          advanced-security: false
          annotations: true

  # ブランチの ruleset で必須チェックにするのはこのジョブだけにし、
  # ジョブを増やしたときは needs に足す。
  ci-ok:
    name: CI OK
    # 必須チェックはスキップされると成功扱いになるので、needs が失敗しても
    # スキップされないよう always() で必ず動かし、結果はステップで判定する。
    if: always()
    needs: [test, lint, coverage, mutation, zizmor]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions: {}

    steps:
      # 失敗の結果を列挙すると未知の結果を通してしまうので、すべて success かを確かめる。
      - name: Check all jobs succeeded
        env:
          NEEDS: ${{ toJSON(needs) }}
        run: jq -e 'all(.[]; .result == "success")' <<< "$NEEDS" || { echo "$NEEDS"; exit 1; }
