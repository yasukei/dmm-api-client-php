name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    name: "Test (PHP ${{ matrix.php-version }}, ${{ matrix.dependency-version }})"
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        php-version: ['8.3', '8.4', '8.5']
        dependency-version: [prefer-lowest, prefer-stable]

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup PHP
        uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240 # 2.37.2
        with:
          php-version: ${{ matrix.php-version }}
          coverage: none

      # composer.lock は下限の PHP 8.3 で解決してあり、その指定は
      # config.platform.php として composer.json に入っている。これは
      # composer update にも効くので、外さないと 8.4 / 8.5 のジョブまで
      # 8.3 とみなして解決してしまい、それらの利用者が実際に入れる
      # 組み合わせを一度も試さないことになる。
      # lint ジョブは lock どおりに入れたいので、そちらでは外さない。
      - name: Resolve against the runner's PHP, not the locked floor
        run: composer config --unset platform.php

      - name: Install dependencies
        run: composer update --${{ matrix.dependency-version }} --no-interaction --no-progress

      - name: Run tests
        run: composer test

  lint:
    name: Lint
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup PHP
        uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240 # 2.37.2
        with:
          php-version: '8.3'
          coverage: none

      # Packagist への公開を見据えて、composer.json の不備（警告を含む）と
      # composer.lock の追従漏れをここで落とす。
      - name: Validate composer.json and composer.lock
        run: composer validate --strict

      - name: Install dependencies
        run: composer install --no-interaction --no-progress

      - name: PHPStan
        run: composer stan

      - name: PHP-CS-Fixer
        run: composer cs-check

      - name: Rector
        run: composer rector-dry

  coverage:
    name: Coverage
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup PHP
        uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240 # 2.37.2
        with:
          php-version: '8.3'
          coverage: pcov

      - name: Install dependencies
        run: composer install --no-interaction --no-progress

      # shell を指定しない run は pipefail なしの bash -e で動き、パイプの終了コードが
      # tee のものになる。shell: bash を明示して pipefail を付け、テストが落ちたら
      # このステップも落ちるようにする。
      - name: Run tests with coverage
        shell: bash
        run: composer coverage -- --colors=never | tee coverage.txt

      - name: Write coverage to job summary
        if: always()
        run: |
          {
            echo '```text'
            cat coverage.txt
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
