version: 2

# Security updates はリポジトリ設定で有効にするもので、ここの schedule / groups /
# cooldown には従わず、脆弱性が公開され次第パッケージごとに PR が作られる。
# 以下はすべて Version updates の設定。

updates:
  - package-ecosystem: composer
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: '09:00'
      timezone: Asia/Tokyo
    # ライブラリなので、範囲内の minor / patch では composer.lock だけを更新し、
    # composer.json の下限は上げない。範囲外の major のときだけ制約を書き換える。
    versioning-strategy: increase-if-necessary
    cooldown:
      default-days: 3
      semver-major-days: 7
    commit-message:
      prefix: chore
      include: scope
    # どのグループにも入らない major は、パッケージごとに個別の PR になる。
    groups:
      composer:
        applies-to: version-updates
        update-types: [minor, patch]

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: '09:00'
      timezone: Asia/Tokyo
    cooldown:
      default-days: 3
      semver-major-days: 7
    commit-message:
      prefix: chore
      include: scope
    groups:
      github-actions:
        applies-to: version-updates
        update-types: [minor, patch]
