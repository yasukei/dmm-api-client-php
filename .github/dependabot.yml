version: 2

# Security updates はリポジトリ設定で有効にするもので、ここの schedule / groups /
# cooldown には従わず、脆弱性が公開され次第パッケージごとに PR が作られる。
# versioning-strategy と commit-message は Security updates にも効く。

updates:
  - package-ecosystem: composer
    directory: /
    schedule:
      interval: monthly
      time: '09:00'
      timezone: Asia/Tokyo
    # ライブラリなので widen を使う。範囲内の minor / patch では composer.lock だけを更新し、
    # 範囲外の major では ^2.6 || ^3.0 のように範囲を広げて、旧 major の利用者を切り捨てない。
    # require-dev は利用者に伝わらないため、major の PR を手で編集して旧 major の範囲を消す。
    versioning-strategy: widen
    cooldown:
      default-days: 7
    commit-message:
      prefix: chore
      include: scope
    # どのグループにも入らない major は、パッケージごとに個別の PR になる。
    groups:
      composer:
        update-types: [minor, patch]

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
      time: '09:00'
      timezone: Asia/Tokyo
    cooldown:
      default-days: 7
    commit-message:
      prefix: chore
      include: scope
    groups:
      github-actions:
        update-types: [minor, patch]
